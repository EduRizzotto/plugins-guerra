name: TeamsPlugin
version: '1.1.0'
main: com.eduardo.teams.TeamsPlugin
api-version: '1.21'
softdepend: [voicechat]
description: Sistema completo de gerenciamento de times com GUI, Simple Voice Chat, protecao contra fogo amigo e Placares de Parede.
commands:
  team:
    description: Gerencia times, abre o painel interativo ou gerencia placares (/team placar).
    usage: /team [create|list|members|leader|tag|color|invite|accept|kick|tell|leave|disband|placar]
  placar:
    description: Obtém as molduras exclusivas de placar de parede e gerencia os placares do lobby.
    aliases: [placares, ranking, leaderboard]
    usage: /placar [kit|clans|players|destaques|rotativo|ver|tamanho|atualizar|listar|remover|limpar]
  berrante:
    description: Entrega um Berrante Localizador (apenas OP/admin).
    aliases: [horn]
    usage: /berrante
  airdrop:
    description: Spawna ou gerencia Caixas de Suprimentos (apenas OP/admin).
    aliases: [supplydrop, caixa]
    usage: /airdrop [aqui|destrancar|limpar]
  cacada:
    description: Inicia ou controla o evento de Cacada (apenas OP/admin).
    aliases: [hunt]
    usage: /cacada [agora|coords|horarios|parar]
  quest:
    description: Abre o painel de Quests Diarias de Equipe.
    aliases: [quests, missoes, missao]
    usage: /quest [resetar]
  reliquia:
    description: Inicia ou controla o evento Portador da Reliquia (apenas OP/admin).
    aliases: [relic, coroa]
    usage: /reliquia [aqui|ping|parar]
  dominio:
    description: Inicia ou controla o evento Torre de Dominio / Capture a Area (apenas OP/admin).
    aliases: [torre, koth]
    usage: /dominio [aqui|parar]
permissions:
  teams.admin:
    description: Permite pegar e gerenciar as molduras de placar do servidor.
    default: op
