name: TeamsPlugin
version: '1.1.0'
main: com.eduardo.teams.TeamsPlugin
api-version: '1.21'
softdepend: [voicechat]
description: Sistema completo de gerenciamento de times com GUI, Simple Voice Chat, protecao contra fogo amigo e Placares de Parede.
commands:
  team:
    description: Gerencia times, abre o painel interativo ou gerencia placares (/team placar).
    usage: /team [create|list|members|leader|tag|color|invite|accept|kick|tell|leave|disband|points|placar]
  placar:
    description: Obtém as molduras exclusivas de placar de parede e gerencia os placares do lobby.
    aliases: [placares, ranking, leaderboard]
    usage: /placar [kit|clans|players|destaques|rotativo|ver|tamanho|atualizar|listar|remover|limpar]
  berrante:
    description: Entrega um Berrante Localizador (apenas OP/admin).
    aliases: [horn]
    usage: /berrante
  airdrop:
    description: Spawna ou gerencia Caixas de Suprimentos (apenas OP/admin).
    aliases: [supplydrop, caixa]
    usage: /airdrop [aqui|destrancar|limpar]
  cacada:
    description: Inicia ou controla o evento de Cacada (apenas OP/admin).
    aliases: [hunt]
    usage: /cacada [agora|coords|horarios|parar]
  quest:
    description: Abre o painel de Quests Diarias de Equipe.
    aliases: [quests, missoes, missao]
    usage: /quest [resetar]
  reliquia:
    description: Inicia ou controla o evento Portador da Reliquia (apenas OP/admin).
    aliases: [relic, coroa]
    usage: /reliquia [aqui|ping|parar]
  dominio:
    description: Inicia ou controla o evento Torre de Dominio / Capture a Area (apenas OP/admin).
    aliases: [torre, koth]
    usage: /dominio [aqui|parar]
  doom:
    description: Gera ou controla a gigantesca Fortaleza DOOM I (Cidadela Infernal) entre 5000 e 6000 blocos do spawn (apenas OP/admin).
    aliases: [fortalezadoom, dungeondoom]
    usage: /doom [aqui|tp|abrir|parar]
  doom2:
    description: Gera ou controla a gigantesca Fortaleza DOOM II (Abismo Corrompido) entre 5000 e 6000 blocos do spawn (apenas OP/admin).
    aliases: [fortalezadoom2, dungeondoom2]
    usage: /doom2 [aqui|tp|abrir|parar]
  doom3:
    description: Gera ou controla a gigantesca Fortaleza DOOM III (Templo do Sol Sangrento) entre 5000 e 6000 blocos do spawn (apenas OP/admin).
    aliases: [fortalezadoom3, dungeondoom3]
    usage: /doom3 [aqui|tp|abrir|parar]
  open:
    description: Libera o acesso ao Nether ou ao The End (apenas OP/admin).
    usage: /open <nether|end>
  close:
    description: Bloqueia o acesso ao Nether ou ao The End (apenas OP/admin).
    usage: /close <nether|end>
  leader:
    description: Autoriza ou remove jogadores que podem criar times com /team create (apenas OP/admin).
    aliases: [lider, lideres]
    usage: /leader <add|remove|list> [nome]
  kit:
    description: Abre o painel de Kits Oficiais, resgata um kit liberado ou gerencia permissoes (/kit permission).
    aliases: [kits]
    usage: /kit [rango|sobrevivencia|minerador|alquimista|arqueiro|construtor|permission]
  aura:
    description: Abre o painel de Auras Coloridas, equipa uma aura ou gerencia qual jogador e qual cor de aura cada player tera (/aura permission).
    aliases: [auras]
    usage: /aura [cor|on|off|permission|<jogador>] <cor|todas|remover>
  proteger:
    description: Bloqueia colocar e quebrar blocos em uma area por coordenadas (estilo /fill).
    aliases: [zonabloco, areabloco]
    usage: /proteger <x1> <y1> <z1> <x2> <y2> <z2> [nome] | listar | remover <nome> | limpar
  safezone:
    description: Bloqueia colocar blocos, quebrar blocos e PvP em uma area por coordenadas (estilo /fill).
    aliases: [zonasegura, protegerpvp]
    usage: /safezone <x1> <y1> <z1> <x2> <y2> <z2> [nome] | listar | remover <nome> | limpar
  base:
    description: Cria ou remove a base protegida do time (30 blocos para cada lado, sem lava e limite de 5 TNTs por time).
    usage: /base <criar|remover|info>
  capturetheflag:
    description: Inicia ou gerencia o evento Capture The Flag nas bases dos times (apenas OP/admin).
    aliases: [ctf, roumabandeira]
    usage: /capturetheflag [iniciar|status|finalizar|parar]
  tempestadeend:
    description: Invoca ou gerencia o evento Tempestade do End / Fenda do Vazio (apenas OP/admin).
    aliases: [endstorm, fendaend, tempestade]
    usage: /tempestadeend [aqui|status|parar]
  tempestadenether:
    description: Invoca ou gerencia o evento Tempestade do Nether / Fenda Infernal (apenas OP/admin).
    aliases: [netherstorm, fendanether]
    usage: /tempestadenether [aqui|status|parar]
permissions:
  teams.admin:
    description: Permite pegar e gerenciar as molduras de placar do servidor.
    default: op
